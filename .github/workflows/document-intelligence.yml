name: Document Intelligence Demo
on:
  push:
    paths:
      - 'projects/document-intelligence-toolkit/**'
      - '.github/workflows/document-intelligence.yml'
  pull_request:
    paths:
      - 'projects/document-intelligence-toolkit/**'
      - '.github/workflows/document-intelligence.yml'
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: projects/document-intelligence-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py demo/sample.json --no-llm
